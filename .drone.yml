kind: pipeline
type: docker
name: default

steps:
- name: test
  image: alpine
  commands:
  - apk add --update --no-cache make git
  - make generate
  - git status --porcelain | grep '^[^ ?]' &> /dev/null && echo "make generate changes not staged for commit" && exit 1
  - make
  - make test

trigger:
  ref:
    include:
    - refs/heads/main
    - refs/pull/**
    - refs/tags/**
