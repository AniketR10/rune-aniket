kind: pipeline
type: docker
name: default

steps:
- name: test
  image: alpine
  commands:
  - apk add --update --no-cache make git
  - make generate
  - git status --porcelain | grep '^[^ ?]' &> /dev/null && echo "make generate changes not staged for commit" && exit 1
  - make
  - make test
- name: slack
  image: plugins/slack
  when:
    status:
    - failure
    - success
  settings:
    webhook:
      from_secret: slack_webhook_url
    channel: git
    icon_url: https://raw.githubusercontent.com/drone/brand/master/logos/png/dark/drone-logo-png-dark-256.png

trigger:
  ref:
    include:
    - refs/heads/main
    - refs/pull/**
    - refs/tags/**
