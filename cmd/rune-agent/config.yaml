extensions:
  rune-agent:
    path: '$RUNE_DATADIR/bin/rune-agent'
    config:
      # Provider API keys, custom OpenAI-compatible endpoints, codex login
      # state, and local model registries now live host-side under the
      # top-level `models.*` block in the rune config (managed via the
      # `models providers` and `models local` rune shell commands).
      # Name of the project instructions file to discover. The agent
      # walks up from the workspace root looking for files with this
      # name and injects their contents into the system prompt.
      agents_file: AGENTS.md
      # Model used for chat sessions (agent command).
      default_model: codex/gpt-5.5
      # Model used for quick queries (? command).
      query_default_model: codex/gpt-5.5
      # Model used for conversation compaction/summarization.
      # When empty, the chat model is used.
      # compact_model: ''
      skills:
        - .rune/skills
        - ~/.rune/skills
        - .agents/skills
        - ~/.agents/skills
      background_attr:
        bg: default
      user_msg_attr:
        fg: default
        bg: default
        flags: dim
      user_msg_background_attr:
        bg: gray
      assistant_msg_attr:
        fg: default
        bg: default
        flags: italic
      input_box_attr:
        fg: default
        bg: default
      input_box_placeholder_attr:
        fg: red
        bg: default
      input_box_frame_attr:
        fg: default
        bg: default
      context_hint_attr:
        fg: red
