# Rune user configuration (emacs editor preset).
editor:
  mode: emacs
  auto_pair: true
  modeless:
    attr: {fg: default, bg: default}
    bar_attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
  status_bar:
    layout: '██▓▒░  {{ .Filepath }}  {{ .GitShortRef }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn }}:{{ .CursorLine }}  {{ .TotalLines }} lines  {{ .Language | bold }}  ░▒▓██'
terminal:
  modal: false
command:
  key: <a-x>                       # execute-extended-command (M-x)
  key_bindings:
    # Files and sessions use familiar Emacs C-x chords.
    "<c-x><c-s>": write            # save-buffer
    "<c-x>s": writeall             # save-some-buffers
    "<c-x><c-c>": quit             # save-buffers-kill-terminal
    "<c-x><c-f>": searchfile       # find-file
    # P/N/B/F follows Emacs's previous, next, backward, and forward directions.
    "<m-p>": "windowfocus up"
    "<m-b>": "windowfocus left"
    "<m-n>": "windowfocus down"
    "<m-f>": "windowfocus right"
    "<s-m-p>": "windowmove up"
    "<s-m-b>": "windowmove left"
    "<s-m-n>": "windowmove down"
    "<s-m-f>": "windowmove right"
    # C-x 0/1/2/3 keeps GNU Emacs's window lifecycle meanings.
    "<c-x>0": windowclose
    "<c-x>1": windowcloseall
    "<c-x>2": "windownew down"
    "<c-x>3": "windownew right"
    "<c-m-i>": ""
    "<c-m-j>": ""
    "<c-m-k>": ""
    "<c-m-l>": ""
    "<c-s-m-i>": ""
    "<c-s-m-j>": ""
    "<c-s-m-k>": ""
    "<c-s-m-l>": ""
    "<m-h>": ""
    "<m-j>": ""
    "<m-k>": ""
    "<m-l>": ""
    "<s-m-h>": ""
    "<s-m-j>": ""
    "<s-m-k>": ""
    "<s-m-l>": ""
    # Resize stays on modified arrows instead of consuming Emacs editing letters.
    "<c-a-m-i>": ""
    "<c-a-m-j>": ""
    "<c-a-m-k>": ""
    "<c-a-m-l>": ""
    "<c-a-m-up>": "windowresize increase height"
    "<c-a-m-left>": "windowresize decrease width"
    "<c-a-m-down>": "windowresize decrease height"
    "<c-a-m-right>": "windowresize increase width"
    "<s-m-up>": ""
    "<s-m-left>": ""
    "<s-m-down>": ""
    "<s-m-right>": ""
    "<alt-meta-h>": ""
    "<alt-meta-j>": ""
    "<alt-meta-k>": ""
    "<alt-meta-l>": ""
    # Tabs use <meta-[> / <meta-]> so <alt> stays available as Emacs Meta.
    "<m-]>": tabnext
    "<m-[>": tabprevious
    "<c-tab>": tabnext
    "<c-s-tab>": tabprevious
    "<s-m-w>": tabclose
    "<s-m-]>": "tabmove right"
    "<s-m-[>": "tabmove left"
    # C-x [ / ] walks cursor history; C-x C-x exchanges point and mark.
    "<c-x>[": "cursorhistory prev"
    "<c-x>]": "cursorhistory next"
    "<c-x><c-x>": exchangepointandmark
    # C-x g searches the workspace; C-x n / p visits its matches.
    "<c-x>g": searchtext               # grep across the workspace
    "<c-x>n": "jumptolocation next search"
    "<c-x>p": "jumptolocation prev search"
    # Language tools follow the same C-x family in the GUI and terminal.
    "<c-x>d": "lsp definition"
    "<c-x>r": "lsp references"
    "<c-x>i": "lsp implementation"
    "<c-x>t": "lsp hover"
    "<c-x>b": "lsp format"
    "<c-x>e": "lsp diagnostics"
    # F5/F6 visits Git changes; F7/F8 visits diagnostics.
    "<f5>": gitprevchange
    "<f6>": gitnextchange
    "<f7>": lspprevdiagnostic
    "<f8>": lspnextdiagnostic
    # F2 visits bookmarks; add <shift> to go back.
    "<m-f2>": "locationtoggle bookmark"
    "<f2>": "jumptolocation next bookmark"
    "<s-f2>": "jumptolocation previous bookmark"
    "<a-f2>": "locationhighlight bookmark"
    "<s-m-f2>": "locationdeleteall bookmark"
    # <alt> remains Emacs Meta for editing commands such as M-f, M-b, M-d and M-w.
    "<a-w>": ""
    "<a-l>": ""
    "<a-h>": ""
    "<a-`>": ""
    "<a-f>": ""
    "<a-v>": ""
    "<a-s>": ""
    "<a-d>": ""
    "<a-r>": ""
    "<a-i>": ""
    "<a-t>": ""
    "<a-b>": ""
    "<a-j>": ""
    "<a-k>": ""
    "<a-s-l>": ""
    "<a-s-h>": ""
    "<a-s-t>": ""
    "<a-s-e>": ""
    "<a-s-r>": ""
    "<a-s-d>": ""
    "<a-s-i>": ""
    "<a-s-j>": ""
    "<a-s-k>": ""
    "<a-1>": ""
    "<a-2>": ""
    "<a-3>": ""
    "<a-4>": ""
    "<a-5>": ""
    "<a-6>": ""
    "<a-7>": ""
    "<a-8>": ""
    "<a-9>": ""
    "<a-s-1>": ""
    "<a-s-2>": ""
    "<a-s-3>": ""
    "<a-s-4>": ""
    "<a-s-5>": ""
    "<a-s-6>": ""
    "<a-s-7>": ""
    "<a-s-8>": ""
    "<a-s-9>": ""
    "<alt-enter>": ""
    # C-SPC sets the mark; C-x / opens completion.
    "<c-space>": ""
    "<c-x>/": "lsp complete"

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   max_lines:         1000
#   initial_reservoir: 0           # pre-spawned emulator instances
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_align_bottom:    false
#     status_error_icon:   ""
#     status_success_icon: ""

# ---------------------------------------------------------------------------
# Animations between workspaces
