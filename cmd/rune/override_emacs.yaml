# Rune user configuration (emacs editor preset).
editor:
  mode: emacs
  auto_pair: true
  modeless:
    attr: {fg: default, bg: default}
    bar_attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
  status_bar:
    layout: '██▓▒░  {{ .Filepath }}  {{ .GitShortRef }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn }}:{{ .CursorLine }}  {{ .TotalLines }} lines  {{ .Language | bold }}  ░▒▓██'
terminal:
  modal: false
command:
  key: <a-x>                       # execute-extended-command (M-x)
  key_bindings:
    # Files & session
    "<c-x><c-s>": write            # save-buffer
    "<c-x>s": writeall             # save-some-buffers
    "<c-x><c-c>": quit             # save-buffers-kill-terminal
    "<c-x><c-f>": searchfile       # find-file
    # Window and tab management live on the <meta> (Cmd) layer inherited
    # from rune.star, not on C-x: in a terminal <c-x> is frequently
    # intercepted by the terminal emulator / OS, so C-x-prefixed window/tab
    # bindings never reach Rune. <meta> is unused by real Emacs and has no
    # editor conflict, so window management uses the base <m-h/l/j/k>
    # (focus), <s-m-h/l/j/k> (move), <c-m-h/v> (split), <m-w> (close), and
    # <s-m-f> (maximize) chords directly.
    #
    # Tab management: the base <alt> tab chords are unbound below (the emacs
    # editor owns <alt> as Meta), so add <meta>-layer tab bindings here.
    "<m-]>": tabnext
    "<m-[>": tabprevious
    "<s-m-w>": tabclose
    "<s-m-]>": "tabmove right"
    "<s-m-[>": "tabmove left"
    # Rune-only history commands also hang off the C-x prefix. C-c is
    # unavailable as a prefix: the emacs editor claims a bare <c-c> for
    # copy, so it never reaches the command sequencer.
    "<c-x>[": "cursorhistory prev"
    "<c-x>]": "cursorhistory next"
    # exchange-point-and-mark: swap point with the most recent C-SPC mark.
    "<c-x><c-x>": exchangepointandmark
    # Workspace-wide text search and match navigation.
    "<c-x>g": searchtext               # grep across the workspace
    "<c-x>n": "jumptolocation next search"
    "<c-x>p": "jumptolocation prev search"
    # Language intelligence on the C-x prefix (GUI mode has no <alt> LSP
    # chords: <alt> is Meta, owned by the editor). Mirrors the TUI C-x LSP
    # family so the same muscle memory works in the GUI.
    "<c-x>d": "lsp definition"
    "<c-x>r": "lsp references"
    "<c-x>i": "lsp implementation"
    "<c-x>t": "lsp hover"
    "<c-x>b": "lsp format"
    "<c-x>e": "lsp diagnostics"
    "<c-x>j": "lspnextdiagnostic"
    "<c-x>l": "lspprevdiagnostic"
    "<c-x><c-n>": "gitnextchange"
    "<c-x><c-p>": "gitprevchange"
    # Bookmarks stay on the function-key row: unambiguous and clear of the
    # editor and C-x/C-c prefixes.
    "<m-f2>": "locationtoggle bookmark"
    "<f2>": "jumptolocation next bookmark"
    "<s-f2>": "jumptolocation previous bookmark"
    "<a-f2>": "locationhighlight bookmark"
    "<s-m-f2>": "locationdeleteall bookmark"
    "<m-f>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    # <alt> is authentic Emacs Meta, owned by the editor (M-f/b/d/w, M-x,
    # M-;, M-</>, case ops). Unbind every base <alt> command chord so the
    # editor — not the command layer — receives them and nothing is shadowed.
    "<a-w>": ""
    "<a-l>": ""
    "<a-h>": ""
    "<a-`>": ""
    "<a-f>": ""
    "<a-v>": ""
    "<a-s>": ""
    "<a-d>": ""
    "<a-r>": ""
    "<a-i>": ""
    "<a-t>": ""
    "<a-b>": ""
    "<a-j>": ""
    "<a-k>": ""
    "<a-s-l>": ""
    "<a-s-h>": ""
    "<a-s-t>": ""
    "<a-s-e>": ""
    "<a-s-r>": ""
    "<a-s-d>": ""
    "<a-s-i>": ""
    "<a-s-j>": ""
    "<a-s-k>": ""
    "<a-1>": ""
    "<a-2>": ""
    "<a-3>": ""
    "<a-4>": ""
    "<a-5>": ""
    "<a-6>": ""
    "<a-7>": ""
    "<a-8>": ""
    "<a-9>": ""
    "<a-s-1>": ""
    "<a-s-2>": ""
    "<a-s-3>": ""
    "<a-s-4>": ""
    "<a-s-5>": ""
    "<a-s-6>": ""
    "<a-s-7>": ""
    "<a-s-8>": ""
    "<a-s-9>": ""
    "<alt-enter>": ""
    # C-SPC is set-mark-command in the editor; drop the base lsp-complete
    # binding so the editor receives it. Completion stays on <c-x>/ below.
    "<c-space>": ""
    "<c-x>/": "lsp complete"

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font_size: 13
#   line_height_offset: 0
#   column_width_offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor behavior
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom)
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   max_lines:         1000
#   initial_reservoir: 0           # pre-spawned emulator instances
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_align_bottom:    false
#     status_error_icon:   ""
#     status_success_icon: ""

