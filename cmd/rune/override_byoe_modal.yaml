# Rune user configuration (BYOE editor preset, modal fallback).
#
# The block under "ACTIVE OVERRIDES" wires Rune to dispatch editing to
# an external TUI editor; Rune still owns tabs, files, and commands,
# while the external process owns the buffer and cursor. The
# `fallback` editor (modal here) is used for URIs the external editor
# cannot serve, such as Rune's file explorer at memory:///fexplorer.
# Everything below the active block is commented out: uncomment what
# you want to change. The shown values are Rune's built-in defaults;
# run `:config` from inside Rune to re-open this file.

# ---------------------------------------------------------------------------
# ACTIVE OVERRIDES — required for the BYOE preset
# ---------------------------------------------------------------------------
editor:
  mode: byoe
  byoe:
    command: '<<.Command>>'
    goto: '<<.Goto>>'
    fallback: modal

# ---------------------------------------------------------------------------
# Switch BYOE editor
#
# `command` is the argv template Rune executes inside a vte to open a
# file. Available substitutions:
#   {file}  absolute path (always required)
#   {line}  1-based line for the initial cursor
#   {col}   1-based column for the initial cursor
# `goto` is a Rune key sequence (handler.ParseSequence syntax) that
# drives the running editor to {line}/{col}. Leave empty to disable
# :goto / click-to-line.
# ---------------------------------------------------------------------------
# editor:
#   byoe:
#     # Vim
#     command: 'vim "+call cursor({line}, {col})" {file}'
#     goto:    '<esc>:{line}<enter>{col}|'
#     # Neovim
#     # command: 'nvim "+call cursor({line}, {col})" {file}'
#     # goto:    '<esc>:{line}<enter>{col}|'
#     # Helix
#     # command: 'hx {file}:{line}:{col}'
#     # goto:    '<esc>:goto<space>{line}<enter>'
#     # Kakoune
#     # command: 'kak {file} +{line}:{col}'
#     # goto:    '<esc>:edit<space>-existing<space>{file}<space>{line}<space>{col}<enter>'
#     # Emacs (no window system)
#     # command: 'emacs -nw +{line}:{col} {file}'
#     # goto:    '<a-x>goto-line<enter>{line}<enter>'

# log_level: info               # debug | info | warn | error
# log_path: ~/.rune/debug.log

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live and `:colorPalette` to see named colors.
# Try `mullen` for a deep-purple / hot-pink feel, or `kernighan` for the
# classic Windows-Terminal palette.
# ---------------------------------------------------------------------------
# gui:
#   default_theme: romero
#   font-size: 13
#   line-height-offset: 0
#   column-width-offset: -1
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100

# ---------------------------------------------------------------------------
# Editor behavior (applies to the fallback editor only)
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true
#   auto_pair: false
#   auto_save: false
#   initial_folds: true

# ---------------------------------------------------------------------------
# Auxiliary bar (left of each editor pane; applies to the fallback editor)
# ---------------------------------------------------------------------------
# editor:
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true

# ---------------------------------------------------------------------------
# Editor status bar (bottom; applies to the fallback editor)
#
# `layout` is a Go text/template string. Components: Status, Filepath,
# GitShortRef, GitDiffAdd, GitDiffDel, ShiftRight, CursorColumn,
# CursorLine, TotalLines, Language. Pipe operators: bg, fg, bold,
# italic, underline, reverse, dim.
# ---------------------------------------------------------------------------
# editor:
#   status_bar:
#     enabled: true
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   modal:             true
#   max_lines:         1000
#   initial_reservoir: 0
#   plugin:
