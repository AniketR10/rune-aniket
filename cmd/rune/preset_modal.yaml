    "<a-s-2>": "tabmove 2"
    "<a-s-3>": "tabmove 3"
    "<a-s-4>": "tabmove 4"
    "<a-s-5>": "tabmove 5"
    "<a-s-6>": "tabmove 6"
    "<a-s-7>": "tabmove 7"
    "<a-s-8>": "tabmove 8"
    "<a-s-9>": "tabmove 9"
    "<m-1>": "workspacefocus 1"
    "<m-2>": "workspacefocus 2"
    "<m-3>": "workspacefocus 3"
    "<m-4>": "workspacefocus 4"
    "<m-5>": "workspacefocus 5"
