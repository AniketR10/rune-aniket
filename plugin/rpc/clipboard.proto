syntax = "proto3";

option go_package = "unstable.build/go-tui/plugin/rpc";

package plugin;

import "google/protobuf/timestamp.proto";

message SetRegisterRequest {
	string register_id = 1;
	uint64 handler_id = 2;
}

message SetRegisterResponse {
}


service Clipboard {
	rpc SetRegister(SetRegisterRequest) returns (SetRegisterResponse);
}

message ClipboardCopyRequest {
	string data = 1;
    google.protobuf.Timestamp timestamp = 2;
}

message ClipboardCopyResponse {
}

message ClipboardPasteRequest {
}

message ClipboardPasteResponse {
    string data = 1;
    google.protobuf.Timestamp timestamp = 2;

}

service ClipboardRegister {
	rpc Copy(ClipboardCopyRequest) returns (ClipboardCopyResponse);
	rpc Paste(ClipboardPasteRequest) returns (ClipboardPasteResponse);
}
