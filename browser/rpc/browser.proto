syntax = "proto3";

option go_package = "unstable.build/go-tui/browser/rpc";

import "term/rpc/term.proto";

package browser;

message OpenResourceRequest {
    string resource = 1;
}

message OpenResourceResponse {
	uint64 handler_id = 1;
}

message SetMessageRequest {
	string msg = 1;
}

message SetMessageResponse {}

message Mapping {
	term.Event from = 1;
	term.Event to = 2;
}

enum Orientation {
	Default = 0;
	Top = 1;
	Bottom = 2;
	Left = 3;
	Right = 4;
}

message SplitRequest {
	uint64 handler_id = 1;
	Orientation orientation = 2;
	uint64 window_id = 3;
}

message SplitResponse {
	uint64 window_id = 1;
}

message BarRequest {
	uint64 handler_id = 1;
	Orientation orientation = 2;
}

message BarResponse {
}

message FloatingWindowRequest {
	uint64 handler_id = 1;
	term.Coordinates offset = 2;
	uint32 alignment = 3;
}

message FloatingWindowResponse {
	uint64 window_id = 1;
}

message TabRequest {
	uint64 handler_id = 1;
    string resource_id = 2;
    string resource_name = 3;
}

message TabResponse {
	uint64 tab_handler_id = 1;
}

message FocusRequest {
}

message SetFocusRequest {
	uint64 window_id = 1;
}

message FocusResponse {
	uint64 window_id = 1;
}

message PublishRequest {
	term.Event ev = 1;
}

message PublishResponse {
}

service ResourceOpener {
	rpc Open(OpenResourceRequest) returns (OpenResourceResponse);
}

service Messenger {
	rpc SetMessage(SetMessageRequest) returns (SetMessageResponse);
}

service EventPublisher {
	rpc Publish(PublishRequest) returns (PublishResponse);
}

service WindowManager {
	rpc Focus(FocusRequest) returns (FocusResponse);
	rpc SetFocus(SetFocusRequest) returns (FocusResponse);
	rpc Split(SplitRequest) returns (SplitResponse);
	rpc Bar(BarRequest) returns (BarResponse);
	rpc Floating(FloatingWindowRequest) returns (FloatingWindowResponse);
	rpc Tab(TabRequest) returns (TabResponse);
}

message WindowCloseRequest {
}

message WindowCloseResponse {
}

message WindowSetContentRequest {
	uint64 handler_id = 1;
}

message WindowSetContentResponse {
}

message WindowContentRequest {
}

message WindowContentResponse {
	uint64 handler_id = 1;
}

service Window {
	rpc SetContent(WindowSetContentRequest) returns (WindowSetContentResponse);
	rpc Content(WindowContentRequest) returns (WindowContentResponse);
	rpc Close(WindowCloseRequest) returns (WindowCloseResponse);
}

message DimensionsRequest {}
message DimensionsResponse {
	uint32 width = 1;
	uint32 height = 2;
}

service Floating {
	rpc Dimensions(DimensionsRequest) returns (DimensionsResponse);
}
