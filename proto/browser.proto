syntax = "proto3";

import "term.proto";

package proto;

message OpenResourceRequest {
    string resource = 1;
}

message OpenResourceResponse {
// string error = 1;
// string handler_id = 2;
}

message SetMessageRequest {
	string msg = 1;
}

message SetMessageResponse {}

message Mapping {
	Event from = 1;
	Event to = 2;
}

message MergeKeyMapRequest {
	repeated Mapping mappings = 1;
}

message MergeKeyMapResponse {
}

message SplitRequest {
	uint32 handler_id = 1;
}

message SplitResponse {
	uint32 window_id = 2;
}

message SubscribeRequest {
	Event ev = 1;
	uint32 handler_id = 2;
}

message SubscribeResponse {
}

message PublishRequest {
	Event ev = 1;
}

message PublishResponse {
}

service ResourceOpener {
	rpc Open(OpenResourceRequest) returns (OpenResourceResponse);
}

service Messenger {
	rpc SetMessage(SetMessageRequest) returns (SetMessageResponse);
}

service KeyMapper {
	rpc MergeKeyMap(MergeKeyMapRequest) returns (MergeKeyMapResponse);
}

service EventSubscriber {
	rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
}

service EventPublisher {
	rpc Publish(PublishRequest) returns (PublishResponse);
}

service WindowManager {
	rpc SplitVerticalRight(SplitRequest) returns (SplitResponse);
	rpc SplitVerticalLeft(SplitRequest) returns (SplitResponse);
	rpc SplitHorizontalAbove(SplitRequest) returns (SplitResponse);
	rpc SplitHorizontalBelow(SplitRequest) returns (SplitResponse);
}

message WindowCloseRequest {
}

message WindowCloseResponse {
}

service Window {
	rpc Close(WindowCloseRequest) returns (WindowCloseResponse);
}
