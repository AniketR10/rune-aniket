syntax = "proto3";

option go_package = "github.com/ernestrc/go-tui/proto;proto";

import "term.proto";

package proto;

message Key {
	Event event = 1;
	string id = 2;
	string description = 3;
}

message Manual {
	string summary = 1;
	repeated Key keys = 2;
}

message Coordinates {
	int32 X = 1;
	int32 Y = 2;
}

