syntax = "proto3";

option go_package = "github.com/ernestrc/go-tui/proto;proto";

import "term.proto";
import "tui.proto";

package proto;

message EditRequest {
	string resource_name = 1;
	repeated CellRow buffer = 2;
}

message EditResponse {
	uint32 handler_id = 1;
}

message EditorEvent {
  enum Type {
	TypeOpen = 0;
	TypeClose = 1;
	TypeFlush = 2;
	TypeEdit = 3;
	TypeCommand = 4;
	TypeScroll = 5;
	TypeFocus = 6;
	TypeUnfocus = 7;
	TypeCursor = 8;
  }

  Type type = 1;
  string resource_name = 2;
  uint32 resource_id = 3;

  Coordinates start = 4;
  Coordinates end = 5;
  Coordinates from = 6;
  Coordinates to = 7;
  string content = 8;
  repeated string cmdArgs = 9;
}

message EditorSubscribeRequest {
	repeated EditorEvent.Type type = 1;
	uint32 handler_id = 2;
}

message EditorSubscribeResponse {
}

message SetLocationListRequest {
	message Location {
		Coordinates from = 1;
		Coordinates to = 2;
		Attributes attr = 3;
		string msg = 4;
	}
	uint32 handler_id = 1;
	string list_id = 2;
	repeated Location locations = 3;
}

message SetLocationListResponse {}

message EditCellRequest {
	uint32 handler_id = 1;
	Coordinates start = 2;
	Coordinates end = 3;
	string str = 4;
}

message EditCellResponse {
	Coordinates from = 1;
	Coordinates to = 2;
	string old = 3;
}

message RawCellsRequest {
	uint32 handler_id = 1;
}

message RawCellsResponse {
	repeated CellRow rows = 1;
}

message MoveToLocationRequest {
	uint32 handler_id = 1;
	string list_id = 2;
}

message MoveToLocationResponse {
}

message RegisterCommandRequest {
	string command = 1;
	uint32 handler_id = 2;
}

message RegisterCommandResponse {}

message SetCursorRequest {
	Coordinates pos = 1;
	uint32 handler_id = 2;
}

message SetCursorResponse {
}

message CursorRequest {
	uint32 handler_id = 1;
}

message CursorResponse {
	Coordinates pos = 1;
}

message EditorRequest {
	string resource_name = 1;
}

message EditorResponse {
	uint32 handler_id = 1;
}

service Editor {
	rpc Edit(EditRequest) returns (EditResponse);
	rpc Subscribe(EditorSubscribeRequest) returns (EditorSubscribeResponse);
	rpc Register(RegisterCommandRequest) returns (RegisterCommandResponse);
	rpc SetCursor(SetCursorRequest) returns (SetCursorResponse);
	rpc Cursor(CursorRequest) returns (CursorResponse);
	rpc Editor(EditorRequest) returns (EditorResponse);

	// locations
	rpc SetLocationList(SetLocationListRequest) returns (SetLocationListResponse);
	rpc MoveToNextLocation(MoveToLocationRequest) returns (MoveToLocationResponse);
	rpc MoveToPrevLocation(MoveToLocationRequest) returns (MoveToLocationResponse);


	// Editor
	rpc EditCell(EditCellRequest) returns (EditCellResponse);

	// View
	rpc RawCells(RawCellsRequest) returns (RawCellsResponse);
}
