syntax = "proto3";

import "term.proto";
import "tui.proto";

package proto;

message DrawRequest {
	int32 width = 1;
	int32 height = 2;
}

message DrawResponse {
	message Cursor {
		Coordinates position = 1;
		bool show = 2;
	}

	repeated CellRow rows = 1;
	Cursor cursor = 2;
}

message HandleRequest {
	Event event = 1;
}

message HandleResponse {
	bool handled = 1;
	bool quit = 2;
}

message ManRequest {}

message ManResponse {
	Manual man = 1;
}

message OnUnmountRequest {}
message OnUnmountResponse {}

service Handler {
	rpc Draw(DrawRequest) returns (DrawResponse);
	rpc Handle(HandleRequest) returns (HandleResponse);
	rpc Man(ManRequest) returns (ManResponse);
	rpc OnUnmount(OnUnmountRequest) returns (OnUnmountResponse);
}
