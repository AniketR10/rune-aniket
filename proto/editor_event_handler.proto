syntax = "proto3";

option go_package = "github.com/ernestrc/go-tui/proto;proto";

package proto;

import "editor.proto";

message EditorEventHandleRequest {
	EditorEvent event = 1;
}

message EditorEventHandleResponse {
	bool quit = 1;
	bool handled = 2;
}

service EditorEventHandler {
	rpc Handle(EditorEventHandleRequest) returns (EditorEventHandleResponse);
}
