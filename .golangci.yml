run:
  timeout: 5m
  exclude-dirs:
    - bin
    - target
# we should slowly fix tests too
issues:
  exclude:
    - SA1019 # deprecations
  exclude-rules:
    - path: (.+)_test.go
      linters:
        - funlen
        - errcheck
        - unused
        - govet
        - ineffassign
        - staticcheck
        - gosimple
