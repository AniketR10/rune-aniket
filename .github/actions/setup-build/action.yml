name: Set up Rune build environment
description: >-
  Installs Go from go.mod plus, on Linux runners, the C toolchain and
  X11/Wayland/ALSA headers ebiten links against.

inputs:
  extra-packages:
    description: Additional apt packages to install on Linux runners.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc g++ pkg-config \
          libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev \
          libxinerama-dev libxi-dev libxxf86vm-dev \
          libasound2-dev libwayland-dev libxkbcommon-dev \
          xauth xvfb $EXTRA_PACKAGES
