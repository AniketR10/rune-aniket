name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The analysis cannot be uploaded on this plan (see below), so on a
    # pull request it burns 45 minutes and throws the results away. Run it
    # where the signal is still useful: post-merge and on the weekly cron.
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:go
          # This account's plan does not include GitHub Advanced Security,
          # so private-repo code scanning uploads are rejected with
          # "Advanced Security must be enabled for this repository". Still
          # run the queries so regressions in the analysis itself are
          # caught; drop this once the repository is public (GHAS is free
          # for public repos).
          upload: never

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Advisories land independently of our commits, so the weekly cron is
    # what actually catches them; per-PR runs mostly re-report the same
    # dependency set.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  modverify:
    name: Module integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # A clean runner has no VCS cache, so this is what catches a go.sum
      # that only resolves against a stale local checkout.
      - name: Verify go.mod and go.sum
        run: |
          go mod verify
          go mod tidy -diff
