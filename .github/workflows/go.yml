name: Go
on: [push]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.18
      uses: actions/setup-go@v1
      with:
        go-version: 1.18
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v1

    - name: Granting private modules access
      run: |
        git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}:x-oauth-basic@github.com/ernestrc".insteadOf "https://github.com/ernestrc"     

    - name: Get dependencies
      run: |
        go get -v -t -d ./.../...

    - name: Build
      run: make

    - name: Lint
      run: make lint
      
    - name: Test
      run: make test
