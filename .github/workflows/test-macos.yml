name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: macos-15
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps `git describe --tags` into the binary, which
          # needs the tag history a shallow clone omits.
          fetch-depth: 0

      - uses: ./.github/actions/setup-build

      - name: Build binaries
        run: make

      - name: Smoke test the built binary
        run: ./bin/rune --version

      - name: Test
        run: make test GOTESTFLAGS='-race -timeout 300s -p 1'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: rune-macos-15
          path: bin/
          retention-days: 7
